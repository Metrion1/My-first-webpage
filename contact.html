<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact me</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Cormorant+Unicase:wght@300;400;500;600;700&display=swap');
    </style>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <button class="burger">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="project.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="todo-list/index.html">Todo List</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <p>Reach out and TOUCH ME!</p>
        <div id="contact-banner"></div>
        <p>Pull my finger!</p>
        <form id="contact-form" novalidate>
            <p>All fields marked with an asterisk (<span class="red">*</span>) are required.</p>
            <div class="form-group">
                <label for="Name">Name<span class="red">*</span>:</label>
                <input type="text" id="Name" value="" placeholder="Enter your full name" required>
                <span class="field-error" id="name-error"></span>
            </div>

            <div class="form-group">
                <label for="Email">Email<span class="red">*</span>:</label>
                <input type="email" id="Email" value="" placeholder="Enter your email" required>
                <span class="field-error" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="Message">Message<span class="red">*</span>:</label>
                <textarea id="Message" value="" rows="5" placeholder="Enter your message" maxlength="250"
                    required></textarea>
                <span class="field-error" id="message-error"></span>
            </div>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </main>
    <footer class="site-footer">
        <section class="footer-section">
            <h4>About</h4>
            <p>A short Bio about me.</p>
        </section>
        <section class="footer-section">
            <h4>Quick links</h4>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="project.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </section>
        <section class="footer-section">
            <h4>Contact Information</h4>
            <p>Email: <a href="mailto:example@example.com">example@example.com</a></p>
            <p>Phone: <a href="tel:+11234567890">(123) 456-7890</a></p>
        </section>
    </footer>
</body>

</html>
